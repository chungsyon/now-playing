# The Xcode project is generated from this file, so it stays readable and
# never conflicts in git. After changing it (or adding files), run:
#
#   cd ios && xcodegen
#
# Install XcodeGen once with: brew install xcodegen
name: NowPlaying
options:
  bundleIdPrefix: com.chungsyon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NowPlaying:
    type: application
    platform: iOS
    sources:
      - path: NowPlaying
    settings:
      base:
        PRODUCT_NAME: NowPlaying
        PRODUCT_BUNDLE_IDENTIFIER: com.chungsyon.nowplaying
        # iPhone first: the App Store lists it for iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your team here, or pick it in Xcode under Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
      # The slide is drawn pixel by pixel on the CPU, which unoptimised Swift
      # does four times slower. Run from Xcode should feel like the real app.
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: NowPlaying/Info.plist
      properties:
        CFBundleDisplayName: Now Playing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        # Only standard HTTPS, so no export compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Now Playing saves the slide you make to your photo library, so you can add it to an Instagram post next to your photo.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  NowPlayingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: NowPlaying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chungsyon.nowplaying.tests
  NowPlayingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: NowPlaying
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chungsyon.nowplaying.uitests
        TEST_TARGET_NAME: NowPlaying
schemes:
  NowPlaying:
    build:
      targets:
        NowPlaying: all
        NowPlayingTests: [test]
    test:
      targets:
        - NowPlayingTests
  # The walk-through and App Store screenshots; needs the network. See
  # Tests/UITests/Walkthrough.swift.
  Screenshots:
    build:
      targets:
        NowPlaying: all
        NowPlayingUITests: [test]
    test:
      targets:
        - NowPlayingUITests
